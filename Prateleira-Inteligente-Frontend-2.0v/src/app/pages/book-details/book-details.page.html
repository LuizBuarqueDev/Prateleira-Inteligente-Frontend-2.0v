<div class="main-container">
  <div class="go-back">
    <a class="btn-custom" (click)="goBackPage()">
      <mat-icon>arrow_back</mat-icon> Voltar para pagina anterior
    </a>
  </div>

  <app-resource-state [resource]="book" />

  @if (book.hasValue()) {
    @if (book.value(); as book) {
      <div class="book-container">
        <div class="book-left">
          <div class="book-image-container">
            <img
              class="img-16-9"
              [src]="book.cover | bookCover"
              [alt]="'Capa de ' + book.title"
            />
          </div>

          <div class="book-actions">
            <button>Na sua biblioteca</button>
            <button>Baixar PDF</button>
          </div>
        </div>

        <div class="book-right">
          <h2>{{ book.title }}</h2>
          <p>{{ book.description }}</p>
          <p><strong>Ano:</strong> {{ book.publicationDate }}</p>
          <p><strong>Editora:</strong> {{ book.publisher }}</p>
        </div>
      </div>
    }
  }
</div>
