<main class="main-container">
  <div class="details-shell">
    <a mat-button class="back-link" routerLink="/books">
      <mat-icon>arrow_back</mat-icon>
      Voltar para todos os livros
    </a>

    <app-resource-state [resource]="book" />

    @if (book.hasValue()) {
      @if (book.value(); as currentBook) {
        <article class="details-card book-header" aria-label="Detalhes do livro">
          <app-book-cover-display [book]="currentBook" />
          <app-book-summary [book]="currentBook" />
        </article>

        <section class="details-card book-tabs" aria-label="Autores e comentários">
          <mat-tab-group mat-stretch-tabs dynamicHeight animationDuration="150ms">
            <mat-tab>
              <ng-template mat-tab-label>
                <mat-icon>person_outline</mat-icon>
                Detalhes dos autores
              </ng-template>
              <app-book-authors [authors]="currentBook.authors" />
            </mat-tab>
            <mat-tab>
              <ng-template mat-tab-label>
                <mat-icon>chat_bubble_outline</mat-icon>
                Comentários
              </ng-template>
              <ng-template matTabContent>
                <app-book-comments [bookId]="currentBook.id" />
              </ng-template>
            </mat-tab>
          </mat-tab-group>
        </section>
      }
    }
  </div>
</main>
