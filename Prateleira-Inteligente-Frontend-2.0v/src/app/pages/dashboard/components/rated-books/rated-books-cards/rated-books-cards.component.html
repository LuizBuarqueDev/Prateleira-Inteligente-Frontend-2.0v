<app-resource-state [resource]="pagedBooks" />

@if (pagedBooks.hasValue() && !pagedBooks.isLoading()) {
  @for (book of pagedBooks.value().content; track book.id) {
    <div class="rated-books-cards">
      <div class="book-info">
        <div class="img-container">
          <img
            class="img-16-9"
            [src]="book.cover | bookCover"
            [alt]="'Capa de ' + book.title"
          />

          <div>
            <h3>{{ book.title }}</h3>
            <p>{{ book.publisher }}</p>
          </div>
        </div>

        <div class="rating-section">
          <data [value]="book.score">
            {{ book.score }}
            <mat-icon>star_shine</mat-icon>
          </data>
          <p>({{ book.assessmentQuantity }})</p>
        </div>
      </div>
    </div>
  }
}
