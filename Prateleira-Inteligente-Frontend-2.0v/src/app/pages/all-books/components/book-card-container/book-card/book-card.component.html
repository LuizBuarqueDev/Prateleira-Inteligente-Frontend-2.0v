<div class="book-card">
  <div class="img-container">
    <img
      class="img-16-9"
      [src]="
        book()?.cover ||
        'https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg'
        "
        />
  </div>
  <div class="book-info">
    <h3>{{ book()?.title }}</h3>
    <p>{{ book()?.publisher}}</p>
  </div>
</div>
